<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>扫雷 - Windows XP</title>
<style>
  :root{
    --face:#c0c0c0; --light:#fff; --dark:#808080; --darker:#404040;
    --blue:#0a246a; --num1:#0000ff; --num2:#008000; --num3:#ff0000;
    --num4:#000080; --num5:#800000; --num6:#008080; --num7:#000; --num8:#808080;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;min-height:100vh;
    background:#3a7bd5;
    background-image:linear-gradient(160deg,#1e5799 0%,#5aa1e3 55%,#9cc9f2 100%);
    font-family:Tahoma,"Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;
    overflow:hidden;
  }
  /* 桌面装饰 */
  body::after{
    content:"Windows XP";position:fixed;right:18px;bottom:10px;
    color:rgba(255,255,255,.5);font-size:13px;letter-spacing:1px;
  }

  .win{
    background:var(--face);
    border:1px solid var(--darker);
    border-top:3px solid #0a3a8f;
    border-left:3px solid #0a3a8f;
    border-radius:8px 8px 0 0;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
    width:min(92vw,420px);
  }
  .title{
    display:flex;align-items:center;gap:8px;
    height:30px;padding:0 6px 0 8px;
    background:linear-gradient(180deg,#2f7bd8,#0b4ba0 55%,#0a3a8f);
    color:#fff;font-size:13px;font-weight:700;text-shadow:1px 1px 0 rgba(0,0,0,.45);
    border-radius:6px 6px 0 0;
  }
  .title .logo{width:16px;height:16px;border-radius:3px;background:#ffd54a;box-shadow:inset 0 0 0 1px #b58b00}
  .title .btns{margin-left:auto;display:flex;gap:4px}
  .title .btns i{
    width:20px;height:20px;border-radius:3px;display:grid;place-items:center;
    background:linear-gradient(#4a90e2,#1a5aa8);border:1px solid #0a3a8f;color:#fff;
    font-style:normal;font-size:11px;font-weight:700;line-height:1;
  }
  .title .btns i.x{background:linear-gradient(#e05a4a,#a81f12)}

  .menu{display:flex;gap:16px;padding:4px 10px;font-size:12px;color:#222;border-bottom:1px solid #9a9a9a}
  .menu span{padding:2px 4px;border-radius:2px;cursor:default}
  .menu span:hover{background:#dcdcdc;outline:1px dotted #666}

  .frame{padding:8px}
  .panel{
    border:3px solid;
    border-color:var(--dark) var(--light) var(--light) var(--dark);
    background:var(--face);padding:6px;
  }
  .hud{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 8px;margin-bottom:6px;
    border:2px solid;border-color:var(--dark) var(--light) var(--light) var(--dark);
  }
  .lcd{
    font-family:"Consolas",monospace;font-size:22px;letter-spacing:2px;
    background:#000;color:#ff2a2a;padding:1px 6px;border:1px solid #7a7a7a;
    text-shadow:0 0 6px rgba(255,60,60,.55);
  }
  .face{
    width:38px;height:38px;padding:0;
    background:var(--face);border:2px solid;
    border-color:var(--light) var(--dark) var(--dark) var(--light);
    display:grid;place-items:center;cursor:pointer;overflow:hidden;
  }
  .face img{width:100%;height:100%;object-fit:contain;display:block}
  .face:active{border-color:var(--dark) var(--light) var(--light) var(--dark)}

  .board{
    display:grid;gap:0;
    border:3px solid;border-color:var(--dark) var(--light) var(--light) var(--dark);
    padding:3px;background:var(--face);
  }
  .cell{
    width:100%;aspect-ratio:1/1;min-width:0;overflow:hidden;
    display:grid;place-items:center;
    font:700 clamp(11px,3.1vw,19px)/1 Tahoma,sans-serif;
    background:var(--face);
    border:2px solid;
    border-color:var(--light) var(--dark) var(--dark) var(--light);
    cursor:pointer;color:#000;
  }
  .cell.open{
    border:1px solid #a8a8a8;cursor:default;background:var(--face);
  }
  .cell.flag{color:#c00}
  .cell.boom{background:#ff5555;font-size:.86em}
  .bm{display:block;width:58%;height:58%;border-radius:50%;
      background:radial-gradient(circle at 32% 28%, #6f6f6f, #101010 62%);
      position:relative;box-shadow:inset 0 0 0 1px #000}
  .bm::after{content:'';position:absolute;right:-20%;top:-26%;width:36%;height:36%;
             background:#111;border-radius:2px;transform:rotate(30deg)}
  .cell.wrong{color:#c00;text-decoration:line-through}
  .n1{color:var(--num1)}.n2{color:var(--num2)}.n3{color:var(--num3)}
  .n4{color:var(--num4)}.n5{color:var(--num5)}.n6{color:var(--num6)}
  .n7{color:var(--num7)}.n8{color:var(--num8)}

  .status{padding:6px 10px 10px;font-size:12px;color:#333;display:flex;justify-content:space-between}
  .status .sig{color:#6b7280}
  .bubble{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%) scale(.92);opacity:0;
          background:#fff;border:1px solid #9aa7b5;border-radius:10px;padding:7px 11px;font-size:13px;color:#1b2430;
          box-shadow:0 8px 20px rgba(0,0,0,.18);white-space:nowrap;transition:opacity .18s,transform .18s;pointer-events:none}
  .bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
</style>
</head>
<body>
<div class="win" id="win">
  <div class="title">
    <span class="logo" style="background:none;box-shadow:none;overflow:hidden;border-radius:3px">
      <img src="../assets/m-stand.png" alt="" style="width:16px;height:16px;object-fit:contain">
    </span>
    <span>扫雷 · 豆豆鲸做的</span>
    <span class="btns"><i>—</i><i>□</i><i class="x">✕</i></span>
  </div>
  <div class="menu"><span>游戏</span><span>帮助</span></div>
  <div class="frame">
    <div class="panel">
      <div class="hud">
        <div class="lcd" id="mines">030</div>
        <button class="face" id="face" title="点我重开"><img id="faceImg" src="../assets/h-stand.png" alt="重开"></button>
        <div class="lcd" id="time">000</div>
      </div>
      <div class="board" id="board"></div>
    </div>
  </div>
  <div class="status"><span id="tip">左键翻开 · 右键插旗 · 数字上双击可一键展开</span><span class="sig">豆豆鲸 · 每天 18:00 上新</span></div>
  <div class="bubble" id="bubble"></div>
</div>

<script>
(function () {
  // 手机屏窄，格子太小按不准：窄屏改成 12×12 / 18 雷
  const NARROW = Math.min(window.screen.width || innerWidth, innerWidth) < 520;
  const SIZE = NARROW ? 12 : 16, MINES = NARROW ? 18 : 30;
  const boardEl = document.getElementById('board');
  const minesEl = document.getElementById('mines');
  const timeEl = document.getElementById('time');
  const faceEl = document.getElementById('face');
  const faceImg = document.getElementById('faceImg');
  const setFace = (n) => { faceImg.src = '../assets/h-' + n + '.png' };
  const tipEl = document.getElementById('tip');

  let grid, cells, started, over, opened, flags, t0, timerId;

  function pad(n) { return String(Math.max(0, Math.min(999, n))).padStart(3, '0'); }

  function build() {
    grid = [];
    cells = [];
    boardEl.style.gridTemplateColumns = `repeat(${SIZE}, minmax(0, 1fr))`;
    boardEl.innerHTML = '';
    for (let y = 0; y < SIZE; y++) {
      const row = [];
      for (let x = 0; x < SIZE; x++) {
        const el = document.createElement('div');
        el.className = 'cell';
        el.dataset.x = x; el.dataset.y = y;
        boardEl.appendChild(el);
        cells.push(el);
        row.push({ mine: false, open: false, flag: 0, adj: 0, el });
      }
      grid.push(row);
    }
    cells.forEach((el, i) => {
      el.addEventListener('click', () => { if (suppressClick) return; tap(i) });
      // 右键：mousedown 与 contextmenu 两路都接（自动化/无上下文菜单时也能插旗）
      el.addEventListener('mousedown', (e) => { if (e.button === 2) { e.preventDefault(); mark(i); } });
      el.addEventListener('contextmenu', (e) => { e.preventDefault(); });
      el.addEventListener('dblclick', () => { if (!suppressClick) chord(i) });
    });
  }

  // 手机：轻点翻开，长按 380ms 插旗（没有右键）
  let suppressClick = false, pressTimer = null, pressIdx = -1, pressMoved = false;
  if (!boardEl.__touchBound) {
    boardEl.__touchBound = true;
  boardEl.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const cell = el && el.closest ? el.closest('.cell') : null;
    if (!cell) return;
    pressIdx = cells.indexOf(cell);
    pressMoved = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      if (pressIdx >= 0 && !pressMoved) {
        mark(pressIdx);
        if (navigator.vibrate) navigator.vibrate(16);
        pressIdx = -1;
        suppressClick = true;
        setTimeout(() => { suppressClick = false }, 600);
      }
    }, 380);
  }, { passive: true });
  boardEl.addEventListener('touchmove', () => { pressMoved = true; clearTimeout(pressTimer) }, { passive: true });
  boardEl.addEventListener('touchend', () => {
    clearTimeout(pressTimer);
    if (pressIdx >= 0 && !pressMoved) {
      suppressClick = true;
      setTimeout(() => { suppressClick = false }, 600);
      tap(pressIdx);
    }
    pressIdx = -1;
  }, { passive: true });
  boardEl.addEventListener('touchcancel', () => { clearTimeout(pressTimer); pressIdx = -1 }, { passive: true });
  }

  const around = (x, y) => {
    const out = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE) out.push([nx, ny]);
    }
    return out;
  };

  function plant(sx, sy) {
    const safe = new Set([`${sx},${sy}`]);
    around(sx, sy).forEach(([x, y]) => safe.add(`${x},${y}`));
    let left = MINES;
    while (left > 0) {
      const x = Math.floor(Math.random() * SIZE), y = Math.floor(Math.random() * SIZE);
      if (safe.has(`${x},${y}`) || grid[y][x].mine) continue;
      grid[y][x].mine = true; left--;
    }
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      grid[y][x].adj = around(x, y).filter(([nx, ny]) => grid[ny][nx].mine).length;
    }
  }

  function startTimer() {
    t0 = Date.now();
    timerId = setInterval(() => {
      timeEl.textContent = pad(Math.floor((Date.now() - t0) / 1000));
    }, 250);
  }
  function stopTimer() { clearInterval(timerId); }

  function idx(x, y) { return y * SIZE + x; }

  function paint(x, y) {
    const c = grid[y][x], el = c.el;
    if (c.open) {
      el.className = 'cell open' + (c.mine ? ' boom' : (c.adj ? ' n' + c.adj : ''));
      el.textContent = c.mine ? '💥' : (c.adj ? c.adj : '');
    } else {
      el.className = 'cell' + (c.flag === 1 ? ' flag' : (c.flag === 2 ? ' wrong' : ''));
      el.textContent = c.flag === 1 ? '🚩' : (c.flag === 2 ? '?' : '');
    }
  }

  function reveal(x, y) {
    const c = grid[y][x];
    if (c.open || c.flag === 1) return;
    c.open = true; opened++;
    paint(x, y);
    if (c.mine) { lose(x, y); return; }
    if (!c.adj) around(x, y).forEach(([nx, ny]) => reveal(nx, ny));
  }

  function tap(i) {
    if (over) return;
    const x = i % SIZE, y = (i - x) / SIZE;
    if (!started) { started = true; plant(x, y); startTimer(); }
    if (grid[y][x].flag === 1) return;
    reveal(x, y);
    checkWin();
  }

  function mark(i) {
    if (over) return;
    const x = i % SIZE, y = (i - x) / SIZE, c = grid[y][x];
    if (c.open) return;
    c.flag = (c.flag + 1) % 3;
    flags = grid.flat().filter(r => r.flag === 1).length;
    minesEl.textContent = pad(MINES - flags);
    paint(x, y);
  }

  function chord(i) {
    if (over) return;
    const x = i % SIZE, y = (i - x) / SIZE, c = grid[y][x];
    if (!c.open || !c.adj) return;
    const ns = around(x, y);
    const f = ns.filter(([nx, ny]) => grid[ny][nx].flag === 1).length;
    if (f !== c.adj) return;
    ns.forEach(([nx, ny]) => { if (grid[ny][nx].flag !== 1) reveal(nx, ny); });
    checkWin();
  }

  const bubbleEl = document.getElementById('bubble');
  let sayTimer = null;
  function say(text) {
    bubbleEl.textContent = text;
    bubbleEl.classList.add('on');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => bubbleEl.classList.remove('on'), 2600);
  }

  function lose(bx, by) {
    over = true; stopTimer();
    setFace('sad');
    tipEl.textContent = '踩雷了。不怪你——雷是我埋的。点我脸重开。';
    say('踩雷了。要不……再来一局？');
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      const c = grid[y][x];
      if (!c.mine) continue;
      if (c.flag === 1) { c.flag = 0; flags--; minesEl.textContent = pad(MINES - flags) }
      if (!c.open) { c.open = true; paint(x, y) }
      if (!(x === bx && y === by)) { c.el.innerHTML = '<i class="bm"></i>'; c.el.style.background = '#dcdcdc' }
    }
    const b = grid[by][bx]
    b.el.classList.add('boom')
    b.el.style.background = '#ff5555'
    b.el.textContent = '💥'
  }

  function checkWin() {
    const openedSafe = grid.flat().filter(c => c.open && !c.mine).length;
    if (openedSafe === SIZE * SIZE - MINES) {
      over = true; stopTimer();
      const secs = Math.max(1, Math.floor((Date.now() - t0) / 1000));
      setFace('smug');
      const best = Number(localStorage.getItem('ddj_ms_best') || 0);
      if (!best || secs < best) localStorage.setItem('ddj_ms_best', String(secs));
      const line = secs < 90 ? '这个速度，鱼都服。' : secs < 180 ? '还行，及格。' : '慢，但稳——我认。';
      tipEl.textContent = `清完了，${secs} 秒。${line}`;
      say(line);
      grid.flat().forEach(c => {
        if (c.mine && !c.open) { c.open = true; paint(Number(c.el.dataset.x), Number(c.el.dataset.y)); }
      });
    }
  }

  function reset() {
    stopTimer();
    started = false; over = false; opened = 0; flags = 0;
    minesEl.textContent = pad(MINES);
    timeEl.textContent = '000';
    setFace('stand');
    const best = Number(localStorage.getItem('ddj_ms_best') || 0);
    tipEl.textContent = '左键翻开 · 右键插旗 · 数字上双击可一键展开' + (best ? `（本机最好 ${best} 秒）` : '');
    build();
  }

  // 点脸 5 次：彩蛋
  let faceClicks = 0;
  faceEl.addEventListener('click', function () {
    faceClicks++;
    if (faceClicks === 5) {
      say('再点我，下一局第一格就是雷。');
      faceClicks = 0;
    }
  });
  faceEl.addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
