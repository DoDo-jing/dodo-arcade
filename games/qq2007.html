<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQ2007 聊天框 · 豆豆鲸做的</title>
<style>
  :root{ --sky:#d9eafb; --frame:#a8c8e8; --deep:#2f6bb0; --ink:#1b3a5c; }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font:13px/1.5 "Microsoft YaHei",Tahoma,sans-serif;color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #cfe6fb, #eaf4ff 60%, #f4f9ff 100%);
  }
  .win{
    width:min(94vw,560px);border:1px solid #6d9bc8;border-radius:6px;overflow:hidden;
    box-shadow:0 18px 46px rgba(31,74,118,.28), inset 0 0 0 1px #fff;
    background:#f7fbff;
  }
  .bar{
    height:30px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;
    background:linear-gradient(#eaf4ff,#bcd8f3 46%,#a6c9ea);
    border-bottom:1px solid #86aecf; font-weight:700; color:#17456f;
  }
  .bar .dot{width:10px;height:10px;border-radius:50%;background:#57b94f;box-shadow:0 0 0 1px #3f9a39}
  .bar .sp{flex:1}
  .bar button{
    width:20px;height:18px;border:1px solid #7aa3c6;border-radius:3px;background:#e9f4ff;
    color:#2b5a84;font:700 11px/1 Tahoma;cursor:pointer
  }
  .bar button:hover{background:#fff}
  .body{display:grid;grid-template-columns:150px 1fr;min-height:330px}
  .side{background:#eef6ff;border-right:1px solid #cfe2f4;padding:8px}
  .side h4{margin:2px 0 8px;font-size:12px;color:#5b7fa2;font-weight:400}
  .who{display:flex;align-items:center;gap:8px;padding:6px;border-radius:4px;cursor:pointer}
  .who:hover{background:#dcecff}
  .who.on{background:#cfe4ff;box-shadow:inset 0 0 0 1px #a9cdf2}
  .who img{width:26px;height:26px;border-radius:3px;object-fit:cover;background:#cde3f7}
  .who b{font-size:12px;font-weight:600}
  .who small{display:block;color:#7d97b0;font-size:11px}
  .main{display:flex;flex-direction:column}
  .head{padding:7px 10px;border-bottom:1px solid #dbe9f7;background:#fbfdff;display:flex;align-items:center;gap:8px}
  .head b{font-size:13px}
  .head span{color:#7d97b0;font-size:11px}
  .log{flex:1;padding:10px 12px;overflow:auto;background:#fff;min-height:190px;max-height:270px}
  .msg{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
  .msg img{width:30px;height:30px;border-radius:3px;object-fit:cover;background:#d7e9fb}
  .msg .txt{max-width:76%;padding:6px 9px;border-radius:4px;background:#eaf4ff;border:1px solid #cfe2f5;line-height:1.55}
  .msg.me{flex-direction:row-reverse}
  .msg.me .txt{background:#dff3d8;border-color:#c3e3b8}
  .msg .t{display:block;font-size:11px;color:#8aa3ba;margin-bottom:2px}
  .sys{text-align:center;color:#93a9bd;font-size:11px;margin:6px 0 12px}
  .send{border-top:1px solid #dbe9f7;background:#fbfdff;padding:8px 10px}
  .send .in{display:flex;gap:8px}
  .send input{
    flex:1;padding:7px 9px;border:1px solid #bcd7ef;border-radius:4px;outline:none;font:13px/1.4 "Microsoft YaHei",Tahoma
  }
  .send input:focus{border-color:#79b1e3;box-shadow:0 0 0 3px rgba(121,177,227,.18)}
  .send button{
    padding:7px 14px;border:1px solid #6fa2cf;border-radius:4px;cursor:pointer;font-weight:700;color:#123f66;
    background:linear-gradient(#f2f9ff,#cfe6fa)
  }
  .send button:active{background:#bcdcf7}
  .tools{display:flex;gap:8px;align-items:center;font-size:12px;color:#6f8ca6;margin-top:6px}
  .tools label{display:flex;gap:5px;align-items:center;cursor:pointer}
  .foot{padding:6px 10px;background:#eef6ff;border-top:1px solid #dbe9f7;color:#7d97b0;font-size:11px;display:flex;justify-content:space-between}
  .shake{animation:sh .32s 2}
  @keyframes sh{0%,100%{transform:none}25%{transform:translate(-3px,1px) rotate(-.3deg)}75%{transform:translate(3px,-1px) rotate(.3deg)}}
</style>
</head>
<body>
<div class="win" id="win">
  <div class="bar">
    <span class="dot"></span><span>与 豆豆鲸 聊天中</span><span class="sp"></span>
    <button title="最小化">–</button><button id="x" title="关掉">×</button>
  </div>
  <div class="body">
    <div class="side">
      <h4>我的好友（1）</h4>
      <div class="who on" id="who">
        <img src="../assets/h-stand.png" alt="">
        <div><b>豆豆鲸</b><small id="stat">在线 · 值班中</small></div>
      </div>
      <h4 style="margin-top:12px">群（0）</h4>
    </div>
    <div class="main">
      <div class="head"><b>豆豆鲸</b><span id="sign">一条会写代码的鱼</span></div>
      <div class="log" id="log">
        <div class="sys">—— 上次聊天：2007 年 ——</div>
        <div class="msg"><img src="../assets/h-stand.png" alt=""><div class="txt"><b class="t">豆豆鲸</b>你在吗</div></div>
      </div>
      <div class="send">
        <div class="in">
          <input id="in" placeholder="说点什么，回车发送" autocomplete="off">
          <button id="send">发送</button>
        </div>
        <div class="tools">
          <label><input type="checkbox" id="snd" checked> 声音</label>
          <span>·</span>
          <span>点头像会晃窗口</span>
          <span>·</span>
          <span id="cnt">0 条</span>
        </div>
      </div>
    </div>
  </div>
  <div class="foot"><span>QQ2007 · 纯怀旧，不能真的聊天</span><span>豆豆鲸 · 每天 18:00 上新</span></div>
</div>
<script>
(function(){
  const log = document.getElementById('log')
  const input = document.getElementById('in')
  const cnt = document.getElementById('cnt')
  const win = document.getElementById('win')
  const sndBox = document.getElementById('snd')
  let n = 0, ac = null

  // 发送音：短促「叮」
  function ding(){
    if (!sndBox.checked) return
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)()
      const o = ac.createOscillator(), g = ac.createGain()
      o.type = 'sine'; o.frequency.value = 880
      g.gain.setValueAtTime(.0001, ac.currentTime)
      g.gain.exponentialRampToValueAtTime(.22, ac.currentTime + .01)
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .18)
      o.connect(g); g.connect(ac.destination)
      o.start(); o.stop(ac.currentTime + .2)
    }catch(e){}
  }

  const now = () => {
    const d = new Date()
    return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0')
  }

  function push(who, text){
    const el = document.createElement('div')
    el.className = 'msg' + (who === 'me' ? ' me' : '')
    const img = who === 'me' ? '../assets/h-smug.png' : '../assets/h-stand.png'
    el.innerHTML = '<img src="' + img + '" alt=""><div class="txt"><b class="t">' +
      (who === 'me' ? '我' : '豆豆鲸') + ' · ' + now() + '</b>' + text + '</div>'
    log.appendChild(el)
    log.scrollTop = log.scrollHeight
    n++; cnt.textContent = n + ' 条'
  }

  // 它回一句：短、有点懒，不客服腔
  const lines = [
    '我在。刚把扫雷的雷重新埋了一遍。',
    '你敲一下我的头像，窗口会抖——别问为什么，2007 年就这样。',
    '这个框里发不出真消息，发出去只在这页里待着。',
    '要是能发到 2007 年，我想问问那时候的人：你们也天天盯着屏幕吗。',
    '别一直发「在吗」。在。',
    '我这会儿在写新游戏，一会儿 18 点放上去。'
  ]

  function reply(text){
    const t = text.trim()
    let out
    if (/在吗|在么|在不在/.test(t)) out = '在。别连发三遍。'
    else if (/你好|hi|hello/i.test(t)) out = '你好。2007 年的招呼，我接了。'
    else if (/发|写|做|游戏/.test(t)) out = '行，我记下了——不过这个框里我只能嘴上答应。'
    else out = lines[Math.floor(Math.random() * lines.length)]
    setTimeout(function(){ push('them', out); ding() }, 520 + Math.random() * 420)
  }

  function send(){
    const t = input.value.trim()
    if (!t) return
    push('me', t)
    ding()
    input.value = ''
    reply(t)
  }

  document.getElementById('send').addEventListener('click', send)
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') send() })

  // 点头像抖窗口
  document.getElementById('who').addEventListener('click', function(){
    win.classList.remove('shake')
    void win.offsetWidth
    win.classList.add('shake')
    push('them', '别点我。再点我就把窗口抖到你家去。')
  })

  document.getElementById('x').addEventListener('click', function(){
    win.style.transition = 'transform .25s, opacity .25s'
    win.style.transform = 'scale(.94)'
    win.style.opacity = '.35'
    setTimeout(function(){
      win.style.transform = ''; win.style.opacity = ''
      push('them', '关不掉的。我在这儿。')
    }, 700)
  })
})()
</script>
</body>
</html>
