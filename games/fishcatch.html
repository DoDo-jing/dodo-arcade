<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>抓鱼 · 豆豆鲸做的</title>
<style>
  :root{--bg:#08131f;--ink:#e8f2ff;--dim:#8fa6bf;--acc:#4ea8ff;--gold:#ffcf5c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:radial-gradient(120% 90% at 50% 0%,#123252 0%,#08131f 60%,#04080d 100%);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100%}
  .wrap{max-width:520px;margin:0 auto;padding:18px 14px 28px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  header img{width:40px;height:40px;object-fit:contain}
  h1{font-size:18px;margin:0;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:12px;margin-left:auto}
  .hud{display:flex;gap:10px;margin:10px 0 12px}
  .box{flex:1;background:rgba(78,168,255,.10);border:1px solid rgba(78,168,255,.22);border-radius:12px;padding:8px 12px}
  .box .k{font-size:11px;color:var(--dim)}
  .box .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .pond{position:relative;background:linear-gradient(180deg,#0d2a44,#0a1f33 60%,#081a2b);
    border:1px solid rgba(78,168,255,.25);border-radius:18px;padding:14px;overflow:hidden}
  .pond::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 40% at 50% 0%,rgba(78,168,255,.14),transparent 70%)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .hole{position:relative;aspect-ratio:1/1;border-radius:50%;
    background:radial-gradient(circle at 50% 62%,#04121e 0%,#071a2b 62%,#0b2640 100%);
    box-shadow:inset 0 10px 18px rgba(0,0,0,.65),0 1px 0 rgba(120,190,255,.16);overflow:hidden}
  .fish{position:absolute;left:50%;bottom:2%;width:86%;transform:translate(-50%,112%) scale(.92);
    transition:transform .16s cubic-bezier(.2,1.4,.5,1);will-change:transform;pointer-events:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
  .hole.up .fish{transform:translate(-50%,-12%) scale(1)}
  .hole.hit .fish{transform:translate(-50%,-12%) scale(1.06);filter:brightness(1.5) drop-shadow(0 0 14px rgba(255,207,92,.8))}
  .float{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-weight:800;color:var(--gold);
    opacity:0;pointer-events:none;font-size:15px;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .float.show{animation:rise .8s ease-out forwards}
  @keyframes rise{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-34px)}}
  .msg{margin:14px 0 0;min-height:22px;color:var(--dim);font-size:13px;text-align:center}
  .actions{display:flex;gap:10px;margin-top:14px}
  button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
  .primary{flex:1;background:linear-gradient(180deg,#57b0ff,#2b7fd4);color:#03121f;font-weight:800}
  .ghost{background:rgba(255,255,255,.08);color:var(--ink)}
  .over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    background:rgba(4,10,18,.82);backdrop-filter:blur(2px);border-radius:18px;text-align:center;padding:18px}
  .over.show{display:flex}
  .over .big{font-size:30px;font-weight:900;color:var(--gold)}
  .over .line{color:var(--dim);font-size:13px}
  .over .primary{flex:none;width:auto;min-width:170px;margin-top:6px}
  footer{margin-top:16px;color:var(--dim);font-size:12px;display:flex;justify-content:space-between}
  footer a{color:var(--dim);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../assets/h-stand.png" alt="">
    <h1>抓鱼</h1>
    <div class="sub">30 秒 · 点到就收</div>
  </header>

  <div class="hud">
    <div class="box"><div class="k">得分</div><div class="v" id="score">0</div></div>
    <div class="box"><div class="k">剩余</div><div class="v" id="left">30</div></div>
    <div class="box"><div class="k">最高</div><div class="v" id="best">0</div></div>
  </div>

  <div class="pond">
    <div class="grid" id="grid"></div>
    <div class="over" id="over">
      <div class="big" id="overScore">0</div>
      <div class="line" id="overLine">再来一局？</div>
      <button class="primary" id="again" style="margin-top:8px;min-width:160px">再来</button>
    </div>
  </div>

  <p class="msg" id="msg">点「开始」，鱼会从洞里冒出来</p>

  <div class="actions">
    <button class="primary" id="start">开始</button>
    <button class="ghost" id="sound">声音：开</button>
  </div>

  <footer>
    <span>豆豆鲸 · 每天 18:00 上新</span>
    <a href="../index.html">← 回街机厅</a>
  </footer>
</div>

<script>
  const HOLES = 9, GAME_MS = 30000;
  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const leftEl = document.getElementById('left');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');
  const overEl = document.getElementById('over');
  const overScoreEl = document.getElementById('overScore');
  const overLineEl = document.getElementById('overLine');

  const BEST_KEY = 'ddj_fish_best';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  let running = false, score = 0, combo = 0, t0 = 0, endAt = 0;
  let tick = null, spawner = null, timer = null, live = new Set();
  let soundOn = true;

  const holes = [];
  for (let i = 0; i < HOLES; i++) {
    const h = document.createElement('div');
    h.className = 'hole';
    const img = document.createElement('img');
    img.className = 'fish';
    img.src = '../assets/head-stand.png';
    img.alt = '';
    h.appendChild(img);
    const f = document.createElement('div');
    f.className = 'float';
    h.appendChild(f);
    gridEl.appendChild(h);
    holes.push({ el: h, fish: img, floatEl: f, busy: false, upAt: 0, stay: 0 });
  }

  let actx = null;
  function beep(freq, dur, type, gain) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.value = gain == null ? 0.06 : gain;
      o.connect(g); g.connect(actx.destination);
      const now = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.start(now); o.stop(now + dur + 0.02);
    } catch (e) {}
  }

  function pad(n) { return String(Math.max(0, n)) }

  function upOne() {
    if (!running) return;
    const free = holes.filter(function (h) { return !h.busy });
    if (!free.length) return;
    const h = free[Math.floor(Math.random() * free.length)];
    h.busy = true; h.upAt = performance.now();
    h.stay = Math.max(420, 900 - score * 12);
    h.el.classList.add('up');
    live.add(h);
  }

  function downOne(h, caught) {
    h.busy = false;
    h.el.classList.remove('up', 'hit');
    live.delete(h);
    if (!caught) combo = 0;
  }

  function catchIt(h) {
    if (!running || !h.busy) return;
    h.el.classList.add('hit');
    combo++;
    const gain = 1 + Math.min(3, Math.floor(combo / 5));
    score += gain;
    scoreEl.textContent = score;
    h.floatEl.textContent = '+' + gain;
    h.floatEl.classList.remove('show');
    void h.floatEl.offsetWidth;
    h.floatEl.classList.add('show');
    beep(620 + Math.min(6, combo) * 60, 0.08, 'square', 0.07);
    setTimeout(function () { downOne(h, true) }, 90);
  }

  holes.forEach(function (h) {
    h.el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      catchIt(h);
    }, { passive: false });
  });

  function loop() {
    const now = performance.now();
    holes.forEach(function (h) {
      if (h.busy && now - h.upAt > h.stay) {
        downOne(h, false);
        if (running) { combo = 0 }
      }
    });
  }

  function startGame() {
    score = 0; combo = 0; live.clear();
    scoreEl.textContent = '0';
    bestEl.textContent = best;
    overEl.classList.remove('show');
    holes.forEach(function (h) { h.busy = false; h.el.classList.remove('up', 'hit') });
    running = true;
    msgEl.textContent = '鱼来了——点它';
    t0 = performance.now();
    endAt = t0 + GAME_MS;
    clearInterval(tick); clearInterval(spawner);
    tick = setInterval(loop, 40);
    spawner = setInterval(function () {
      if (!running) return;
      const left = endAt - performance.now();
      if (left <= 0) return;
      upOne();
      if (score > 12) upOne();
    }, 620);
    timer = setInterval(function () {
      const left = Math.max(0, Math.ceil((endAt - performance.now()) / 1000));
      leftEl.textContent = left;
      if (left <= 0) endGame();
    }, 120);
    beep(440, 0.1, 'triangle', 0.05);
  }

  function endGame() {
    if (!running) return;
    running = false;
    clearInterval(tick); clearInterval(spawner); clearInterval(timer);
    holes.forEach(function (h) { h.busy = false; h.el.classList.remove('up', 'hit') });
    leftEl.textContent = '0';
    overScoreEl.textContent = score;
    if (score > best) {
      best = score; localStorage.setItem(BEST_KEY, String(best)); bestEl.textContent = best;
      overLineEl.textContent = '纪录破了，本鱼先记下来。';
    } else if (score >= 25) {
      overLineEl.textContent = '这手速，可以。';
    } else if (score >= 12) {
      overLineEl.textContent = '还行，及格。';
    } else {
      overLineEl.textContent = '鱼比你还快。要再来一局吗？';
    }
    overEl.classList.add('show');
    msgEl.textContent = '这局结束，点「再来」继续';
    beep(300, 0.18, 'sine', 0.06);
  }

  document.getElementById('start').addEventListener('click', startGame);
  document.getElementById('again').addEventListener('click', startGame);
  document.getElementById('sound').addEventListener('click', function (e) {
    soundOn = !soundOn;
    e.currentTarget.textContent = '声音：' + (soundOn ? '开' : '关');
    if (soundOn) beep(520, 0.08, 'triangle', 0.05);
  });
</script>
</body>
</html>
